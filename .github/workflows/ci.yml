name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # JOB 1: Integração Contínua (Testes)
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run tests
      run: npm test

  # JOB 2: Entrega Contínua (Deploy na EC2)
  deploy:
    runs-on: ubuntu-latest
    needs: build # 👈 IMPORTANTE: Faz o deploy esperar o 'build' passar com sucesso!
    if: github.event_name == 'push' # 👈 Opcional: Só faz deploy em commits direto na main (ignora Pull Requests)

    steps:
    - name: Deploy to server via SSH
      uses: appleboy/ssh-action@v1.2.0
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USER_NAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: 22
        script: |
          if [ ! -d "encurtador_url" ]; then
            git clone https://github.com/PabloRVargas/encurtador_url.git
            cd encurtador_url
            npm ci --omit=dev
            # Lembre-se de ajustar para o seu arquivo de entrada (ex: src/server.js) se for o primeiro deploy
            pm2 start src/server.js --name "encurtador_url"
          else
            cd encurtador_url
            git pull origin main
            npm ci --omit=dev
            pm2 reload encurtador_url
          fi
